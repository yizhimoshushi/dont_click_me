<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>谁让你扫的</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            /* ★ 禁止 iOS 橡皮筋效果 */
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #fdf6ee 0%, #fef9f4 50%, #f5efe6 100%);
            color: #5a4a3a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* ★ 使用 safe-area padding */
            padding: max(20px, env(safe-area-inset-top)) 24px max(20px, env(safe-area-inset-bottom));
            text-align: center;
            /* ★ 禁止长按选中/弹出菜单 */
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            /* ★ 禁止双击缩放 */
            touch-action: manipulation;
        }

        .page { 
            width: 100%; max-width: 520px; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 60vh;
            animation: softFadeIn 0.8s ease;
        }
        .page.active { display: flex; }

        @keyframes softFadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* 第一页 */
        .gentle-warn {
            font-size: clamp(18px, 4.5vmin, 24px);
            line-height: 2;
            font-weight: 500;
            color: #8b6f5a;
            margin-bottom: 50px;
        }
        .gentle-warn em {
            font-style: normal;
            color: #c4845c;
            font-weight: 600;
        }

        .warm-btn {
            position: fixed;
            bottom: max(40px, calc(env(safe-area-inset-bottom) + 20px));
            right: max(20px, env(safe-area-inset-right));
            background: #c4845c;
            color: #fff;
            border: none;
            padding: 12px 32px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(196,132,92,0.3);
            transition: all 0.3s ease;
            letter-spacing: 1px;
            z-index: 10;
            /* ★ 增大触摸区域 */
            min-height: 44px;
            min-width: 44px;
        }
        .warm-btn:active { transform: scale(0.96); background: #b07348; }

        /* 第二页 */
        .playful-title {
            font-size: clamp(22px, 5.5vmin, 30px);
            color: #c4845c;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .playful-content {
            font-size: clamp(14px, 3.5vmin, 17px);
            line-height: 2.2;
            color: #7a6555;
            text-align: left;
            background: rgba(255,255,255,0.7);
            padding: 28px 24px;
            border-radius: 16px;
            margin-bottom: 35px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(196,132,92,0.15);
            /* ★ 小屏可滚动 */
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            /* ★ 限制最大宽度 */
            width: 100%;
            max-width: 480px;
        }
        .playful-content .emoji { font-size: 1.2em; vertical-align: middle; margin-right: 4px; }
        .playful-content strong { color: #c4845c; font-weight: 600; }

        .punchline {
            font-size: clamp(16px, 4vmin, 20px);
            color: #a08070;
            opacity: 0;
            transition: opacity 1.2s ease;
            font-weight: 500;
            line-height: 1.8;
        }
        .punchline.show { opacity: 1; }
        .punchline small {
            display: block;
            margin-top: 8px;
            font-size: 0.8em;
            color: #bfaa9a;
            font-weight: 400;
        }

        /* === Page 3 样式 === */
        .eval-question {
            font-size: clamp(20px, 5vmin, 26px);
            color: #8b6f5a;
            font-weight: 600;
            margin-bottom: 40px;
            line-height: 1.6;
            /* ★ 防止文字太长撑破布局 */
            word-break: break-word;
            padding: 0 10px;
        }

        .btn-group {
            display: flex;
            /* ★ 手机上改为纵向排列，避免横向挤出屏幕 */
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
        }

        /* ★ 宽屏时横向排列 */
        @media (min-width: 420px) {
            .btn-group {
                flex-direction: row;
                gap: 24px;
            }
        }

        .eval-btn {
            padding: 14px 36px;
            font-size: 17px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            letter-spacing: 1px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            /* ★ 确保最小触摸尺寸 */
            min-height: 48px;
            min-width: 120px;
            /* ★ 防止按钮文字换行 */
            white-space: nowrap;
        }

        .btn-ok {
            background: #c4845c;
            color: #fff;
            box-shadow: 0 4px 15px rgba(196,132,92,0.3);
        }
        .btn-ok:active { transform: scale(0.95); }

        .btn-bad {
            background: #fff;
            color: #c4845c;
            border: 2px solid #c4845c;
            box-shadow: 0 4px 15px rgba(196,132,92,0.1);
        }
        .btn-bad:active { transform: scale(0.95); background: #fef9f4; }

        /* 当按钮被瞬移时的样式 */
        .btn-ok.escaped {
            position: fixed !important;
            z-index: 10000;
            margin: 0;
            /* ★ 添加过渡动画让瞬移更丝滑 */
            transition: left 0.15s ease-out, top 0.15s ease-out;
        }

        .angry-result {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            animation: softFadeIn 0.6s ease;
            padding: 0 20px;
        }
        .angry-result.show { display: flex; }
        
        .angry-text {
            font-size: clamp(22px, 5.5vmin, 28px);
            color: #d45c5c;
            font-weight: 700;
            line-height: 1.8;
        }
        .angry-sub {
            font-size: clamp(14px, 3.5vmin, 16px);
            color: #b07348;
            opacity: 0.8;
        }

        /* 装饰小元素 */
        .deco {
            position: fixed;
            border-radius: 50%;
            opacity: 0.15;
            pointer-events: none;
        }
        .deco-1 { width: 200px; height: 200px; background: #c4845c; top: -60px; right: -60px; }
        .deco-2 { width: 150px; height: 150px; background: #d4a87c; bottom: -40px; left: -40px; }

        /* ★ 横屏适配 */
        @media (orientation: landscape) and (max-height: 500px) {
            .gentle-warn { margin-bottom: 20px; font-size: 16px; line-height: 1.6; }
            .playful-content { max-height: 40vh; padding: 16px; margin-bottom: 15px; }
            .eval-question { margin-bottom: 20px; }
            .btn-group { gap: 12px; }
            .eval-btn { padding: 10px 28px; font-size: 15px; }
            .warm-btn { padding: 8px 24px; font-size: 14px; bottom: 15px; }
        }
    </style>
</head>
<body>
    <div class="deco deco-1"></div>
    <div class="deco deco-2"></div>

    <!-- 第一页 -->
    <div class="page active" id="page1">
        <div class="gentle-warn">
            还屡教不改？<br><br>
            没人告诉你<br>
            <em>陌生二维码也不能随便扫吗？</em>
        </div>
        <button class="warm-btn" id="toPage2">下一页 →</button>
    </div>

    <!-- 第二页 -->
    <div class="page" id="page2">        
        <div class="playful-content">
            <p>你完蛋了，你的手机已经被我"控制"了：</p>
            <br>
            <p>不信你就按音量键，你会发现音量改变了</p>
            <p>按下关机键，屏幕就会灭掉</p>
            <p>而且我现在正在偷走你的电量，你注意看你的电量，过一会就减少了</p>
            <p>除非你现在v我50</p>
        </div>

        <div class="punchline" id="jokeText">
            😊 开玩笑的，别当真<br>
        </div>
        <button class="warm-btn" id="toPage3">下一页 →</button>
    </div>

    <!-- 第三页 -->
    <div class="page" id="page3">
        <!-- 评价区域 -->
        <div id="evalArea">
            <div class="eval-question" id="evalQuestion">你评价一下这个网站怎么样？</div>
            <div class="btn-group" id="btnGroup">
                <button class="eval-btn btn-ok" id="btnOk">还行</button>
                <button class="eval-btn btn-bad" id="btnBad">有病</button>
            </div>
        </div>

        <!-- 生气结果区域 -->
        <div class="angry-result" id="angryResult">
            <div class="angry-text">哎，你竟敢骂我<br>你完蛋了</div>
            <div class="angry-sub">我已经记住你了</div>
        </div>
    </div>

    <script>
        // ================= Supabase 配置与请求封装 =================
        const SUPABASE_URL = 'https://plakgkehqlopwfrsceem.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWtna2VocWxvcHdmcnNjZWVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1NzQyMzQsImV4cCI6MjA4MTE1MDIzNH0.HjlawMHv356F_NaxRagTYR7Q96UnCfAfFLie6XRk1Jg';
        const TABLE_NAME = 'dont_click_me';
        const API_URL = `${SUPABASE_URL}/rest/v1/${TABLE_NAME}`;
        const STORAGE_KEY = 'dont_click_me_device_id';

        function getDeviceId() {
            return localStorage.getItem(STORAGE_KEY);
        }

        async function incrementField(fieldName) {
            const deviceId = getDeviceId();
            if (!deviceId) {
                console.warn('⚠️ 无设备 ID，无法更新计数');
                return;
            }

            const url = `${API_URL}?id=eq.${encodeURIComponent(deviceId)}`;
            const headers = {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
            };

            try {
                const getRes = await fetch(url, { method: 'GET', headers });
                if (!getRes.ok) {
                    console.warn('读取当前值失败:', getRes.status);
                    return;
                }
                const data = await getRes.json();
                if (!data || data.length === 0) {
                    console.warn('未找到设备记录');
                    return;
                }

                const currentValue = data[0][fieldName] || 0;
                const newValue = currentValue + 1;

                const patchRes = await fetch(url, {
                    method: 'PATCH',
                    headers,
                    body: JSON.stringify({ [fieldName]: newValue })
                });

                if (patchRes.ok) {
                    console.log(`✅ ${fieldName} 已更新: ${currentValue} → ${newValue}`);
                } else {
                    console.warn(`❌ ${fieldName} 更新失败:`, patchRes.status);
                }
            } catch (err) {
                console.warn(`网络错误 (${fieldName}):`, err);
            }
        }
        // ================= Supabase 配置结束 =================


        // === 页面切换逻辑 ===
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const page3 = document.getElementById('page3');
        const toPage2Btn = document.getElementById('toPage2');
        const toPage3Btn = document.getElementById('toPage3');
        const jokeText = document.getElementById('jokeText');

        function switchPage(from, to) {
            from.classList.remove('active');
            setTimeout(() => {
                to.classList.add('active');
            }, 100);
        }

        toPage2Btn.addEventListener('click', () => {
            switchPage(page1, page2);
            setTimeout(() => {
                jokeText.classList.add('show');
            }, 2500);
        });

        toPage3Btn.addEventListener('click', () => {
            toPage3Btn.style.display = 'none';
            switchPage(page2, page3);
        });

        // === Page 3 交互逻辑 ===
        const btnOk = document.getElementById('btnOk');
        const btnBad = document.getElementById('btnBad');
        const evalQuestion = document.getElementById('evalQuestion');
        const evalArea = document.getElementById('evalArea');
        const angryResult = document.getElementById('angryResult');

        const tauntTexts = [
            "我再给你选一遍 🙃",
            "你确定吗？🤔",
            "最后给你一次机会 ⚠️",
            "别逼我动手啊 😠",
            "你真的要点这个？💢",
            "手指不听话是吧？🫵",
            "再点一次试试？😈"
        ];

        let okClickCount = 0;
        let badScale = 1;

        // ★ 修复：生成安全的随机位置，充分考虑安全区域和按钮尺寸
        function getRandomPosition() {
            const btnRect = btnOk.getBoundingClientRect();
            const btnW = btnRect.width;
            const btnH = btnRect.height;

            // ★ 安全边距：顶部留出状态栏，底部留出导航栏/手势条
            const safeTop = Math.max(60, parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 60);
            const safeBottom = Math.max(60, window.innerHeight - (window.innerHeight - 80));
            const safeLeft = 15;
            const safeRight = 15;

            const minX = safeLeft;
            const maxX = window.innerWidth - btnW - safeRight;
            const minY = safeTop;
            const maxY = window.innerHeight - btnH - safeBottom;

            // ★ 如果可用空间太小，就居中放置
            if (maxX <= minX || maxY <= minY) {
                return {
                    x: (window.innerWidth - btnW) / 2,
                    y: (window.innerHeight - btnH) / 2
                };
            }

            return {
                x: Math.floor(Math.random() * (maxX - minX + 1)) + minX,
                y: Math.floor(Math.random() * (maxY - minY + 1)) + minY
            };
        }

        // ★ 修复：限制"有病"按钮的最大缩放，确保不超出屏幕
        function getMaxBadScale() {
            const btnRect = btnBad.getBoundingClientRect();
            // 取按钮原始宽高（未缩放时）
            const origW = btnRect.width / badScale;
            const origH = btnRect.height / badScale;
            // 最大允许占屏幕的 85%
            const maxW = window.innerWidth * 0.85 / origW;
            const maxH = window.innerHeight * 0.4 / origH;
            return Math.min(maxW, maxH, 2.5);
        }

        // 点击"还行"的处理
        btnOk.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            // 调用 Supabase 让 ok + 1
            incrementField('ok');

            // 1. 更新提示文字
            const textIndex = Math.min(okClickCount, tauntTexts.length - 1);
            evalQuestion.textContent = tauntTexts[textIndex];
            
            // 2. ★ 增大"有病"按钮，但不超过屏幕限制
            const maxScale = getMaxBadScale();
            badScale = Math.min(badScale + 0.15, maxScale);
            btnBad.style.transform = `scale(${badScale})`;

            if (okClickCount === 0) {
                const badRect = btnBad.getBoundingClientRect();
                // ★ 计算居中位置，而不是锁定在原位（原位在手机上可能偏）
                const centerX = (window.innerWidth - badRect.width) / 2;
                const centerY = (window.innerHeight - badRect.height) / 2;
                btnBad.style.position = 'fixed';
                btnBad.style.left = centerX + 'px';
                btnBad.style.top = centerY + 'px';
                btnBad.style.margin = '0';
                btnBad.style.zIndex = '99';
                // ★ 添加过渡让居中动画更自然
                btnBad.style.transition = 'all 0.3s ease';
            }
            
            // 3. 将"还行"按钮瞬移到随机位置
            const pos = getRandomPosition();
            btnOk.classList.add('escaped');
            btnOk.style.left = pos.x + 'px';
            btnOk.style.top = pos.y + 'px';
            btnOk.style.right = 'auto';
            btnOk.style.bottom = 'auto';

            okClickCount++;
        });

        // 点击"有病"的处理
        btnBad.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();

            // 调用 Supabase 让 bad + 1
            incrementField('bad');

            // 隐藏评价区域
            evalArea.style.display = 'none';
            btnOk.style.display = 'none';
            
            // 显示生气结果
            angryResult.classList.add('show');
            
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100, 50, 200]);
            }
        });

        // ★ 阻止移动端双击缩放
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        // ★ 阻止 iOS 上长按弹出菜单
        document.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>
</body>
</html>
