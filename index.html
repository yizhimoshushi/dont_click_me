<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>启动动画</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; cursor: default; user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            background:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px),
                radial-gradient(ellipse at 30% 40%, #3a3a3a 0%, #2a2a2a 40%, #1a1a1a 70%, #111 100%);
            background-color: #222;
        }

        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: url("data:image/svg+xml,%3Csvg width='6' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='1' height='1' x='0' y='0' fill='rgba(255,255,255,0.02)'/%3E%3Crect width='1' height='1' x='3' y='3' fill='rgba(0,0,0,0.06)'/%3E%3C/svg%3E") repeat;
        }

        /* 最终Bug页面的样式 */
        body.bug-state {
            background: #fff !important;
        }
        body.bug-state::before {
            display: none !important;
        }

        #hint {
            position: fixed; bottom: max(40px, env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.3); font-family: 'Georgia', serif; 
            font-size: clamp(12px, 3vmin, 14px);
            letter-spacing: 2px; transition: opacity 0.8s; z-index: 100;
            white-space: nowrap;
        }

        #candles { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
        .candle-wrapper { 
            position: absolute; display: flex; justify-content: center; align-items: flex-end; 
        }
        
        .candle-wrapper:nth-child(1) { top: calc(50% - 12vmin); left: calc(50% - 22vmin); }
        .candle-wrapper:nth-child(2) { top: calc(50% - 12vmin); left: calc(50% + 22vmin); }
        .candle-wrapper:nth-child(3) { top: calc(50% + 18vmin); left: 50%; }

        .candle {
            position: absolute; 
            width: clamp(10px, 2vmin, 14px); 
            height: clamp(40px, 9vmin, 60px);
            background: linear-gradient(90deg, #d8d0c4 0%, #f5f0e8 25%, #fff 50%, #f0ebe0 75%, #cdc5b8 100%);
            border-radius: 2px; z-index: 2; cursor: pointer; opacity: 0;
            transform: translateY(-30px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .candle.visible { opacity: 1; transform: translateY(0); }
        .candle.lit {
            background: linear-gradient(180deg, rgba(255,210,140,0.5) 0%, rgba(255,190,100,0.2) 20%, transparent 45%),
                linear-gradient(90deg, #d8d0c4 0%, #f5f0e8 25%, #fff 50%, #f0ebe0 75%, #cdc5b8 100%);
        }

        .wick {
            position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
            width: 2px; height: 8px; background: linear-gradient(to top, #444, #111);
            border-radius: 1px; transition: background 0.3s;
        }
        .candle.lit .wick { background: linear-gradient(to top, #cc4400, #333, #111); }

        .flame {
            position: absolute; left: 50%; z-index: 3; pointer-events: none;
            --fw: clamp(8px, 1.5vmin, 10px); 
            --fh: clamp(14px, 2.8vmin, 18px); 
            --ft: calc(var(--fh) * -1.5);
            --blur-outer: 1.2px; --bright-outer: 1.3;
            --blur-inner: 0.6px; --bright-inner: 1.4;
            --glow-spread: 4px; --glow-alpha: 0.6;
            width: var(--fw); height: var(--fh); top: var(--ft);
            transform: translateX(-50%) scale(0); opacity: 0;
            filter: drop-shadow(0 0 var(--glow-spread) rgba(255,160,50,var(--glow-alpha)));
            transition: opacity 0.4s ease, transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
        }
        .flame::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 90%, #ffdd55 0%, #ffaa22 35%, #ff5500 65%, transparent 100%);
            border-radius: 50% 50% 20% 20% / 60% 60% 40% 40%;
            filter: blur(var(--blur-outer)) brightness(var(--bright-outer)); opacity: 0.95;
            animation: flameOuter 2s infinite ease-in-out alternate;
            animation-delay: var(--outer-delay, 0s);
        }
        .flame::after {
            content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
            width: calc(var(--fw) * 0.5); height: calc(var(--fh) * 0.55);
            background: radial-gradient(ellipse at 50% 80%, #fff 0%, #cceeff 30%, #5599ff 70%, transparent 100%);
            border-radius: 50% 50% 30% 30% / 70% 70% 30% 30%;
            filter: blur(var(--blur-inner)) brightness(var(--bright-inner)); opacity: 1;
            animation: flameInner 1.8s infinite ease-in-out alternate-reverse;
            animation-delay: var(--inner-delay, -0.3s);
        }
        .candle.lit .flame { opacity: 1; transform: translateX(-50%) scale(1); }

        @keyframes flameOuter {
            0% { transform: scaleX(1) scaleY(1) skewX(0deg); }
            25% { transform: scaleX(0.92) scaleY(1.06) skewX(-1deg); }
            50% { transform: scaleX(1.04) scaleY(0.94) skewX(1.5deg); }
            75% { transform: scaleX(0.96) scaleY(1.03) skewX(-0.5deg); }
            100% { transform: scaleX(1.02) scaleY(0.97) skewX(0.8deg); }
        }
        @keyframes flameInner {
            0% { transform: translateX(-50%) scaleY(1); }
            50% { transform: translateX(-50%) scaleY(0.85); }
            100% { transform: translateX(-50%) scaleY(1.05); }
        }

        .message {
            position: fixed; left: 50%; bottom: -80px; transform: translateX(-50%);
            font-family: 'Georgia', serif; 
            font-size: clamp(16px, 5vmin, 24px); 
            color: rgba(255,255,255,0.9);
            text-shadow: 0 0 20px rgba(255,180,80,0.7), 0 0 60px rgba(255,120,0,0.3);
            opacity: 0; transition: bottom 1s ease, opacity 0.8s ease;
            z-index: 50; pointer-events: none; 
            white-space: normal; 
            text-align: center;
            width: 90vw;
            max-width: 600px;
            line-height: 1.5;
            padding: 0 10px;
        }
        .message.show { bottom: max(120px, 20vh); opacity: 1; }
        .message.hide { opacity: 0; bottom: max(160px, 25vh); }

        #table-light {
            position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
            transition: opacity 1.5s;
            background: radial-gradient(ellipse at 50% 50%, rgba(255,170,80,0.07) 0%, transparent 60%);
        }
        #table-light.on { opacity: 1; }

        /* --- 花屏效果样式 --- */
        #glitch-container {
            position: fixed; inset: 0; z-index: 9999;
            pointer-events: none;
            display: none;
        }
        .glitch-line {
            position: absolute; left: 0; width: 100%;
            background-color: #000;
        }

        /* --- 新增：阿蒙弹窗样式 --- */
        .amon-overlay {
            position: fixed; inset: 0;
            background: rgba(255, 255, 255, 0.95);
            z-index: 10000;
            display: flex; justify-content: center; align-items: flex-start;
            padding-top: 15vh;
            opacity: 0; transition: opacity 0.3s;
        }
        .amon-overlay.visible { opacity: 1; }

        .amon-modal {
            background: #fff;
            border: 2px solid #333;
            padding: 30px 20px;
            width: 85%; max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
            transform: translateY(-50px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .amon-overlay.visible .amon-modal { transform: translateY(0); }

        .amon-text {
            font-size: 18px; color: #333; line-height: 1.6; margin-bottom: 20px;
        }
        .amon-extra {
            display: inline-block;
            opacity: 0; transform: scale(0.8);
            transition: all 0.4s ease;
            font-weight: bold; color: #000;
        }
        .amon-extra.show { opacity: 1; transform: scale(1); }
        
        .monocle-emoji {
            font-size: 32px; vertical-align: middle; margin-left: 5px;
            display: inline-block;
        }

        .amon-btn {
            background: #333; color: #fff; border: none;
            padding: 10px 24px; font-size: 16px;
            border-radius: 4px; cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .amon-btn:hover { background: #000; }

        /* 最终警告页面样式 */
        .final-warning {
            position: fixed; inset: 0;
            background: #fff; z-index: 10001;
            display: flex; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
            font-family: monospace, sans-serif;
            font-size: 20px; color: #d00; font-weight: bold;
            opacity: 0; transition: opacity 0.5s;
        }
        .final-warning.visible { opacity: 1; }
    </style>
</head>

<body>
    <div id="table-light"></div>
    <div id="candles">
        <div class="candle-wrapper"><div class="candle" id="c1"><div class="wick"></div><div class="flame"></div></div></div>
        <div class="candle-wrapper"><div class="candle" id="c2"><div class="wick"></div><div class="flame"></div></div></div>
        <div class="candle-wrapper"><div class="candle" id="c3"><div class="wick"></div><div class="flame"></div></div></div>
    </div>

    <div class="message" id="msg1">不属于这个时代的愚者啊</div>
    <div class="message" id="msg2">您是灰雾之上的神秘主宰</div>
    <div class="message" id="msg3">您是执掌好运的黄黑之王</div>
    <div class="message" id="msg4">我祈求您的注视</div>
    <div class="message" id="msg5">我祈求您的眷顾……</div>

    <div id="hint">点击屏幕进行仪式</div>
    <div id="glitch-container"></div>

    <script>
        let stage = 0;
        const candles = [document.getElementById('c1'), document.getElementById('c2'), document.getElementById('c3')];
        const msgs = [
            document.getElementById('msg1'),
            document.getElementById('msg2'),
            document.getElementById('msg3'),
            document.getElementById('msg4'),
            document.getElementById('msg5')
        ];
        const hint = document.getElementById('hint');
        const tableLight = document.getElementById('table-light');
        const glitchContainer = document.getElementById('glitch-container');

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // 生成花屏线条
        function generateGlitchLines() {
            glitchContainer.innerHTML = '';
            for (let i = 1; i <= 6; i++) {
                const line = document.createElement('div');
                line.className = 'glitch-line';
                const basePos = (i / 7) * 100;
                const offset = (Math.random() - 0.5) * 5; 
                line.style.top = `${basePos + offset}%`;
                line.style.height = `${Math.floor(Math.random() * 53) + 5}px`;
                glitchContainer.appendChild(line);
            }
        }

        function showGlitchFrame() {
            generateGlitchLines();
            glitchContainer.style.display = 'block';
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        glitchContainer.style.display = 'none';
                    });
                });
            });
        }

        let glitchIntervalId = null;
        function startGlitchLoop(frequencyMs) {
            if (glitchIntervalId) clearInterval(glitchIntervalId);
            showGlitchFrame();
            glitchIntervalId = setInterval(showGlitchFrame, frequencyMs);
        }

        function stopGlitchLoop() {
            if (glitchIntervalId) {
                clearInterval(glitchIntervalId);
                glitchIntervalId = null;
            }
            glitchContainer.style.display = 'none';
        }

        async function showMessage(msgEl, displayTime = 1600) {
            msgEl.classList.add('show');
            await sleep(displayTime);
            msgEl.classList.remove('show');
            msgEl.classList.add('hide');
            await sleep(100);
        }

        // ★ 核心修改：阿蒙恶作剧流程
        async function triggerBugState() {
            stopGlitchLoop();
            
            // 1. 先全部变黑
            document.body.style.background = '#000';
            document.body.style.transition = 'none';
            const allElements = document.body.children;
            for (const el of allElements) {
                el.style.display = 'none';
            }
            
            // 2. 在黑屏状态停留一会儿
            await sleep(400);
            
            // 3. 删除整个页面内容并重置样式
            document.body.innerHTML = '';
            document.body.className = 'bug-state';
            document.body.style.background = ''; 
            
            // 4. 创建弹窗容器
            const overlay = document.createElement('div');
            overlay.className = 'amon-overlay';
            
            const modal = document.createElement('div');
            modal.className = 'amon-modal';
            
            // 初始文字
            const textP = document.createElement('p');
            textP.className = 'amon-text';
            textP.textContent = '你遇到了一个bug';
            
            // 后续追加的文字容器
            const extraSpan = document.createElement('span');
            extraSpan.className = 'amon-extra';
            extraSpan.innerHTML = '哦不，是阿蒙 <span class="monocle-emoji">🧐</span>';
            textP.appendChild(extraSpan);
            
            // 第二段文字（初始隐藏）
            const textP2 = document.createElement('p');
            textP2.className = 'amon-text';
            textP2.style.display = 'none';
            textP2.textContent = '你正在访问的网站被阿蒙偷走了，但他还给了你这个';
            
            // 按钮（初始隐藏）
            const btn = document.createElement('button');
            btn.className = 'amon-btn';
            btn.textContent = '查看';
            btn.style.display = 'none';
            
            modal.appendChild(textP);
            modal.appendChild(textP2);
            modal.appendChild(btn);
            overlay.appendChild(modal);
            document.body.appendChild(overlay);
            
            // 强制重绘以触发动画
            void overlay.offsetWidth;
            overlay.classList.add('visible');
            
            // 5. 等待0.5秒后追加“阿蒙”内容
            await sleep(500);
            extraSpan.classList.add('show');
            
            // 6. 再等待一会显示第二段话和按钮
            await sleep(1200);
            textP2.style.display = 'block';
            btn.style.display = 'inline-block';
            
            // 7. 绑定按钮点击事件
            btn.onclick = () => {
                // 移除弹窗
                overlay.remove();
                
                // 显示最终警告页
                const warning = document.createElement('div');
                warning.className = 'final-warning';
                warning.textContent = '没有人告诉你陌生链接不要点击吗';
                document.body.appendChild(warning);
                
                // 强制重绘
                void warning.offsetWidth;
                warning.classList.add('visible');
            };
        }

        const handleInteraction = async (e) => {
            if (e.type === 'touchend') e.preventDefault(); 
            
            stage++;

            if (stage === 1) {
                hint.textContent = '';
                hint.style.opacity = '0';
                for (const c of candles) {
                    c.classList.add('visible');
                    await sleep(400);
                }
                hint.textContent = '点击点燃蜡烛…';
                hint.style.opacity = '1';
            }
            else if (stage === 2) {
                hint.style.opacity = '0';
                for (const c of candles) {
                    c.classList.add('lit');
                    const flame = c.querySelector('.flame');
                    const outerDelay = (Math.random() * -2).toFixed(2) + 's';
                    const innerDelay = (parseFloat(outerDelay) - 0.3 - Math.random() * 0.5).toFixed(2) + 's';
                    flame.style.setProperty('--outer-delay', outerDelay);
                    flame.style.setProperty('--inner-delay', innerDelay);
                    await sleep(500);
                }
                tableLight.classList.add('on');
                hint.textContent = '再次点击开始仪式…';
                hint.style.opacity = '1';
            }
            else if (stage === 3) {
                hint.style.opacity = '0';

                await showMessage(msgs[0]);
                await showMessage(msgs[1]);
                
                await showMessage(msgs[2]); 
                
                startGlitchLoop(2000); 
                
                await sleep(500);
                await showMessage(msgs[3]); 

                startGlitchLoop(500);

                await sleep(300);

                await showMessage(msgs[4]);

                startGlitchLoop(300); 

                await sleep(1300);

                await triggerBugState();
            }
        };

        document.body.addEventListener('click', handleInteraction);
        document.body.addEventListener('touchend', handleInteraction, { passive: false });
    </script>
</body>
</html>
